<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ready-gm — AI 솔로 플레이</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 15px/1.65 system-ui, "Malgun Gothic", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2030, #0f1115 60%);
    color: #e7e9ee; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; background: #171a21; border-bottom: 1px solid #262b36;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; flex: 0 0 auto;
  }
  header strong { font-size: 15px; }
  header .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #222836; color: #9fb0c8; }
  .meta { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: #9fb0c8; }
  .pill { padding: 2px 8px; border-radius: 999px; background: #222836; }
  .pill.online { background: #1f4a3a; color: #7fd1b9; }
  .pill.busy { background: #4a3a1f; color: #f0c98a; }
  .pill.ended { background: #5a2b33; color: #ffd0d0; }
  button { font: inherit; background: #2f6df0; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button.secondary { background: #2b3242; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 3px solid #f0c040; outline-offset: 2px; }

  /* 2분할 본문 */
  #app { flex: 1 1 auto; display: flex; min-height: 0; }
  .story { flex: 2 1 0; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid #262b36; }
  .sidebar { flex: 1 1 0; min-width: 280px; max-width: 440px; display: flex; flex-direction: column; background: #12151d; }
  .paneHead { padding: 8px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #8b98ac; border-bottom: 1px solid #262b36; flex: 0 0 auto; }
  .scroll { flex: 1 1 auto; overflow: auto; padding: 14px; min-height: 0; }

  .gm { background: #1b2330; border-left: 3px solid #5b8def; padding: 12px 14px; border-radius: 8px; margin-bottom: 10px; white-space: pre-wrap; }
  .gm.opening { border-left-color: #9b6bef; }
  .gm.result { border-left-color: #3fcaa8; }
  .gm.say { border-left-color: #7fd1b9; background: #16221f; }
  .gm.call { border-left-color: #f0a93f; background: #221b14; }
  .gm.ended { border-left-color: #f0c040; box-shadow: 0 0 0 1px rgba(240,192,64,.3) inset; }
  .gm .who { display: block; font-size: 12px; color: #9fb0c8; margin-bottom: 4px; }

  .li { padding: 7px 10px; border-radius: 8px; margin-bottom: 6px; white-space: pre-wrap; font-size: 14px; }
  .li.me { background: #1d2233; border-left: 3px solid #2f6df0; }
  .li.sys { color: #8b98ac; font-size: 13px; }
  .li.judge { background: #221b14; border-left: 3px solid #f0a93f; }

  /* 주사위 트레이 (EZFudge "운명" 주사위) */
  .dice-zone { flex: 0 0 auto; border-top: 1px solid #262b36; background: #12151d; padding: 12px 14px; }
  #diceTray { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; min-height: 0; padding: 4px 2px 26px; overflow-x: auto; }
  #diceTray:empty { display: none; padding: 0; }
  .check-group { display: flex; flex-direction: column; gap: 6px; }
  .check-group .caption { font-size: 11px; color: #9fb0c8; white-space: nowrap; }
  .check-dice { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 24px; }

  .fate-die {
    --size: 72px; --c1: #5b8def; --c2: #1b3a8f; position: relative; width: var(--size); height: var(--size);
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; border-radius: 14px;
    background: linear-gradient(155deg, var(--c1), var(--c2));
    box-shadow: 0 6px 14px rgba(0,0,0,.45), inset 0 2px 5px rgba(255,255,255,.18);
  }
  .fate-die .fate-face { font-size: calc(var(--size) * .38); line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .fate-die .fate-type { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.78); }
  .fate-die .fate-label { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: #9fb0c8; }
  @keyframes diceShake {
    0% { transform: translateY(0) rotate(0deg) scale(1); } 25% { transform: translateY(-9px) rotate(-18deg) scale(1.06); }
    50% { transform: translateY(2px) rotate(14deg) scale(.97); } 75% { transform: translateY(-5px) rotate(-10deg) scale(1.03); }
    100% { transform: translateY(0) rotate(0deg) scale(1); }
  }
  .fate-die.rolling { animation: diceShake .22s linear infinite; }
  @keyframes diceSettle { 0% { transform: scale(1.18); } 60% { transform: scale(.94); } 100% { transform: scale(1); } }
  .fate-die.settled { animation: diceSettle .35s ease-out; }
  .fate-die.kept { outline: 3px solid #7fd1b9; outline-offset: 3px; }
  .fate-die.dropped { opacity: .42; filter: grayscale(.6); }
  @media (prefers-reduced-motion: reduce) { .fate-die.rolling, .fate-die.settled { animation: none; } }

  /* 입력 푸터 */
  footer { flex: 0 0 auto; padding: 10px 14px; border-top: 1px solid #262b36; background: #12151d; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #msg { background: #0f1320; color: #e7e9ee; border: 1px solid #2b3242; border-radius: 8px; padding: 8px 10px; flex: 1; min-width: 200px; }
  #sendBtn { background: #f0a93f; color: #241a00; font-weight: 700; }
  #rollBtn { background: #f0c040; color: #241a00; font-weight: 800; }
  @keyframes rollPulse {
    0% { box-shadow: 0 0 0 0 rgba(240,192,64,.6); }
    70% { box-shadow: 0 0 0 10px rgba(240,192,64,0); }
    100% { box-shadow: 0 0 0 0 rgba(240,192,64,0); }
  }
  #rollBtn:not([hidden]) { animation: rollPulse 1.3s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) { #rollBtn:not([hidden]) { animation: none; } }
  .hint { color: #8b98ac; font-size: 13px; margin: 6px 0 0; }
  .hint.error { color: #ffb0b0; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #f0c98a; border-top-color: transparent; border-radius: 50%; vertical-align: middle; margin-right: 6px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

  @media (max-width: 767px) {
    #app { flex-direction: column; }
    .story { border-right: 0; border-bottom: 1px solid #262b36; }
    .sidebar { min-width: 0; max-width: none; }
    #controls button { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<header>
  <strong>ready-gm</strong>
  <span class="badge">AI 솔로 플레이 (실시간 LLM)</span>
  <span class="meta">
    <span class="pill" id="phasePill">상태 <b id="phase">연결 중…</b></span>
    <button id="newBtn" class="secondary" type="button" aria-label="새 세션 시작">새 세션</button>
  </span>
</header>

<div id="app">
  <section class="story" aria-label="GM 서사">
    <div class="paneHead">GM 서사</div>
    <div id="story" class="scroll" role="log" aria-live="polite" aria-label="GM 서사 로그"></div>
  </section>
  <aside class="sidebar" aria-label="행동 로그 및 주사위">
    <div class="paneHead">행동 로그</div>
    <div id="side" class="scroll" role="log" aria-live="polite" aria-label="행동 로그"></div>
    <div class="dice-zone">
      <div id="diceTray" aria-live="polite" aria-label="운명 주사위 트레이"></div>
    </div>
  </aside>
</div>

<footer>
  <div id="controls">
    <input id="msg" type="text" placeholder='행동을 적고, 대사는 따옴표로… (예: 문을 열며 "누구 있어요?")' aria-label="행동·대사 입력" autocomplete="off" />
    <button id="sendBtn" type="button" aria-label="보내기">보내기</button>
    <button id="rollBtn" type="button" aria-label="주사위 굴리기" hidden>주사위 굴리기</button>
  </div>
  <p class="hint" id="hint" aria-live="polite">세션을 시작하는 중입니다…</p>
</footer>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const storyEl = $("story");
  const sideEl = $("side");
  const msgEl = $("msg");
  const sendBtn = $("sendBtn");
  const rollBtn = $("rollBtn");
  const newBtn = $("newBtn");
  const phaseEl = $("phase");
  const phasePill = $("phasePill");
  const hintEl = $("hint");
  const trayEl = $("diceTray");

  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  // ?token= 을 읽어 모든 fetch 에 x-playtest-token 헤더로 전달한다(host-entry 방식).
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";
  function headers() {
    const h = { "content-type": "application/json" };
    if (token) h["x-playtest-token"] = token;
    return h;
  }

  let sessionId = null;
  let busy = false;
  let ended = false;
  let pending = null; // 판정 대기 중 응답(플레이어가 굴리면 결과 공개)

  const ATTR_LABELS = { Might: "힘", Agility: "민첩", Wits: "지혜", Spirit: "정신" };
  const DIFF_LABELS = { Trivial: "사소", Easy: "쉬움", Average: "보통", Hard: "어려움", Formidable: "지난" };
  const OUTCOME_LABELS = {
    "Failure": "실패",
    "Partial Success": "부분 성공",
    "Success": "성공",
    "Critical Success": "대성공",
  };
  const sign = (n) => (n > 0 ? "+" + n : String(n));

  function gm(cls, who, text) {
    const d = document.createElement("div");
    d.className = "gm " + cls;
    d.innerHTML = `<span class="who">[GM · ${esc(who)}]</span>` + esc(text);
    storyEl.appendChild(d);
    storyEl.scrollTop = storyEl.scrollHeight;
  }
  function log(cls, html) {
    const d = document.createElement("div");
    d.className = "li " + cls;
    d.innerHTML = html;
    sideEl.appendChild(d);
    sideEl.scrollTop = sideEl.scrollHeight;
  }

  function setPhase(label, kind) {
    phaseEl.textContent = label;
    phasePill.className = "pill" + (kind ? " " + kind : "");
  }

  function setBusy(on, label) {
    busy = on;
    sendBtn.disabled = on || ended;
    msgEl.disabled = on || ended;
    if (on) {
      setPhase("판정 중…", "busy");
      hintEl.className = "hint";
      hintEl.innerHTML = `<span class="spinner" aria-hidden="true"></span>${esc(label || "GM이 판정하고 서술하는 중… (수십 초 걸릴 수 있어요)")}`;
    }
  }

  // EZFudge "운명" 주사위 애니메이션. rolls 의 각 항목당 주사위 1개를 만들고,
  // 약 1초간 [-4..+4] 무작위 수를 깜빡인 뒤 실제 rolls[i] 합으로 settle 한다.
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function renderCheck(check) {
    const group = document.createElement("div");
    group.className = "check-group";
    const dieRow = document.createElement("div");
    dieRow.className = "check-dice";
    group.appendChild(dieRow);

    const caption = document.createElement("div");
    caption.className = "caption";
    group.appendChild(caption);
    trayEl.appendChild(group);
    // DOM 폭주 방지: 최근 12개 그룹만 유지.
    while (trayEl.children.length > 12) trayEl.removeChild(trayEl.firstChild);

    const advLabel =
      check.advantage === "advantage" ? "유리(높은 합 채택)"
      : check.advantage === "disadvantage" ? "불리(낮은 합 채택)"
      : "보통";

    const dice = check.rolls.map((total, i) => {
      const die = document.createElement("div");
      die.className = "fate-die rolling";
      die.setAttribute("role", "img");
      const attrLabel = ATTR_LABELS[check.attribute] || check.attribute;
      die.innerHTML =
        `<span class="fate-type">${esc(attrLabel)}</span>` +
        `<span class="fate-face">…</span>` +
        `<span class="fate-label">${check.rolls.length === 2 ? (i + 1) + "차" : "판정"}</span>`;
      dieRow.appendChild(die);
      return die;
    });

    return new Promise((resolve) => {
      const faces = dice.map((d) => d.querySelector(".fate-face"));
      const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      // The number-tumble is a content change (not a CSS transform), so we run it
      // even under reduced motion — just at a calmer cadence and shorter duration.
      // The shaking/popping transforms are CSS and are suppressed by the
      // prefers-reduced-motion media query, which is the correct a11y behavior.
      const stepMs = reduced ? 150 : 80;
      const durationMs = reduced ? 540 : 1000;
      const cycle = setInterval(() => {
        faces.forEach((f) => { f.textContent = sign(rand(-4, 4)); });
      }, stepMs);

      setTimeout(() => {
        clearInterval(cycle);
        // 각 주사위를 실제 합으로 settle.
        dice.forEach((die, i) => {
          die.classList.remove("rolling");
          die.classList.add("settled");
          faces[i].textContent = sign(check.rolls[i]);
          die.setAttribute("aria-label", `운명 주사위 ${sign(check.rolls[i])}`);
        });
        // 유불리(주사위 2개)일 때 채택/탈락 표시.
        if (check.rolls.length === 2) {
          let keptIdx = check.rolls.findIndex((r) => r === check.roll);
          if (keptIdx === -1) {
            keptIdx = check.advantage === "advantage"
              ? (check.rolls[0] >= check.rolls[1] ? 0 : 1)
              : (check.rolls[0] <= check.rolls[1] ? 0 : 1);
          }
          dice.forEach((die, i) => die.classList.add(i === keptIdx ? "kept" : "dropped"));
        }
        const a = ATTR_LABELS[check.attribute] || check.attribute;
        const d = DIFF_LABELS[check.difficulty] || check.difficulty;
        const o = OUTCOME_LABELS[check.outcome] || check.outcome;
        // advantage 가 none 이면 난이도와 중복되는 "보통"을 또 찍지 않는다.
        const advText = check.advantage === "none" ? "" : ` · ${advLabel}`;
        caption.textContent = `${a} · ${d}${advText} → ${o}`;
        resolve();
      }, durationMs);
    });
  }

  async function revealChecks(checks) {
    for (const check of checks) {
      await renderCheck(check);
      const a = ATTR_LABELS[check.attribute] || check.attribute;
      const d = DIFF_LABELS[check.difficulty] || check.difficulty;
      const o = OUTCOME_LABELS[check.outcome] || check.outcome;
      const advTag =
        check.advantage === "advantage" ? " · 유리"
        : check.advantage === "disadvantage" ? " · 불리" : "";
      const rollsText = check.rolls.map(sign).join(", ");
      log("judge", `🎯 ${esc(a)}·${esc(d)}${advTag} 합 [${esc(rollsText)}] → 채택 ${sign(check.roll)} → <b>${esc(o)}</b>`);
    }
  }

  async function startSession() {
    ended = false;
    sessionId = null;
    pending = null;
    rollBtn.hidden = true;
    storyEl.replaceChildren();
    sideEl.replaceChildren();
    trayEl.replaceChildren();
    msgEl.value = "";
    setBusy(true, "세션을 시작하고 도입부를 생성하는 중…");
    try {
      const res = await fetch("/solo/new", { method: "POST", headers: headers(), body: JSON.stringify({}) });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      sessionId = data.sessionId;
      gm("opening", data.scenario && data.scenario.title ? data.scenario.title : "도입", data.opening || "");
      log("sys", "행동을 입력해 모험을 시작하세요.");
      setBusy(false);
      setPhase("진행 중", "online");
      hintEl.className = "hint";
      hintEl.textContent = '행동을 적어 보내세요. 대사는 따옴표(" ")로 감싸면 말하기로 처리됩니다.';
      msgEl.focus();
    } catch (err) {
      setBusy(false);
      setPhase("오류", "ended");
      hintEl.className = "hint error";
      hintEl.textContent = "세션을 시작하지 못했어요. \"새 세션\"으로 다시 시도해 주세요.";
    }
  }

  // 플레이어 대사 라인(서사에 출력, "GM ·" 접두사 없이).
  function sayLine(text) {
    const d = document.createElement("div");
    d.className = "gm say";
    d.innerHTML = `<span class="who">나 (대사)</span>` + esc(`“${text}”`);
    storyEl.appendChild(d);
    storyEl.scrollTop = storyEl.scrollHeight;
  }

  // GM이 판정을 호출한다(플레이어가 직접 굴리도록). 결과는 굴린 뒤 공개.
  function callForRoll(checks) {
    const lines = checks.map((c) => {
      const a = ATTR_LABELS[c.attribute] || c.attribute;
      const d = DIFF_LABELS[c.difficulty] || c.difficulty;
      const advTxt =
        c.advantage === "advantage" ? " · 유리" : c.advantage === "disadvantage" ? " · 불리" : "";
      return `${a} · ${d}${advTxt}`;
    });
    const list = lines.map((l) => `• ${l}`).join("\n");
    const head =
      checks.length > 1
        ? `${checks.length}개의 판정이 필요합니다:\n${list}\n아래 “주사위 굴리기”를 눌러 한 번에 굴려 주세요.`
        : `${lines[0]} 판정이 필요합니다. 아래 “주사위 굴리기”를 눌러 직접 굴려 주세요.`;
    gm("call", "판정", head);
    rollBtn.hidden = false;
    rollBtn.disabled = false;
    rollBtn.focus();
  }

  function finishTurn(data) {
    if (data.endingReached) {
      ended = true;
      gm("ended", "세션 종료", "이 모험은 막을 내렸습니다. “새 세션”으로 새 이야기를 시작하세요.");
      log("sys", "✦ 세션 종료");
      setPhase("세션 종료", "ended");
      sendBtn.disabled = true;
      msgEl.disabled = true;
      rollBtn.disabled = true;
      busy = false;
      hintEl.className = "hint";
      hintEl.textContent = '세션이 끝났습니다. 우측 상단 “새 세션”으로 다시 시작하세요.';
      return;
    }
    setBusy(false);
    setPhase("진행 중", "online");
    hintEl.className = "hint";
    hintEl.textContent = "다음 행동이나 대사를 입력하세요.";
    msgEl.focus();
  }

  // 입력 해석: 따옴표(" " 또는 “ ”) 안의 단어는 대사, 나머지는 행동으로 취급한다.
  function parseUtterance(text) {
    const quoteRe = /["“”]([^"“”]*)["“”]/g;
    const says = [];
    let m;
    while ((m = quoteRe.exec(text)) !== null) {
      const s = m[1].trim();
      if (s) says.push(s);
    }
    const action = text.replace(quoteRe, " ").replace(/\s+/g, " ").trim();
    return { says, action };
  }

  async function submit() {
    if (busy || ended || !sessionId || pending) return;
    const text = msgEl.value.trim();
    if (!text) {
      hintEl.className = "hint";
      hintEl.textContent = "먼저 입력해 주세요.";
      return;
    }
    const { says, action } = parseUtterance(text);
    // 화면 표시: 대사는 서사에, 행동은 행동 로그에.
    for (const s of says) sayLine(s);
    if (action) log("me", `🧭 <b>나</b>: ${esc(action)}`);
    // 따옴표가 닫히지 않는 등으로 아무것도 못 뽑으면 전체를 행동으로 처리.
    if (says.length === 0 && !action) log("me", `🧭 <b>나</b>: ${esc(text)}`);
    msgEl.value = "";
    setBusy(true);
    // 보낼 텍스트: 행동이 섞여 있으면 원문 그대로(따옴표를 GM이 대사로 해석),
    // 순수 대사면 발화로 프레이밍해 불필요한 판정을 억제한다.
    const sendText = action
      ? text
      : (says.length ? says.map((s) => `“${s}”`).join(" ") + "라고 말한다." : text);

    try {
      const res = await fetch("/solo/act", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ sessionId, action: sendText }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data || data.ok === false) {
        const message = (data && data.message) || "GM 응답을 받지 못했어요. 잠시 후 다시 시도해 주세요.";
        throw new Error(message);
      }

      if (Array.isArray(data.checks) && data.checks.length > 0) {
        // 판정이 필요하면 결과 서술을 숨기고, 플레이어가 직접 굴리도록 대기한다.
        pending = data;
        busy = false;
        sendBtn.disabled = true;
        msgEl.disabled = true;
        setPhase("판정 대기", "busy");
        hintEl.className = "hint";
        hintEl.textContent = "주사위를 굴려 판정을 확정하세요.";
        callForRoll(data.checks);
      } else {
        // 판정 없음(대사/비전투 등): GM 서술 즉시 공개.
        gm("result", "결과", data.narration || "");
        finishTurn(data);
      }
    } catch (err) {
      setBusy(false);
      setPhase("진행 중", "online");
      msgEl.value = text; // 재시도를 돕도록 입력 복원
      hintEl.className = "hint error";
      hintEl.textContent =
        (err && err.message ? err.message : "오류가 발생했어요.") + " 다시 시도해 주세요.";
      msgEl.focus();
    }
  }

  // 플레이어가 "주사위 굴리기"를 누르면: 기존 주사위를 비우고 그 자리에서 굴린 뒤 결과 공개.
  async function doRoll() {
    if (!pending) return;
    rollBtn.disabled = true;
    setPhase("판정 중…", "busy");
    trayEl.replaceChildren(); // 기존 주사위 제거 → 새 굴림이 같은 자리에서 진행(스택 방지)
    await revealChecks(pending.checks);
    const data = pending;
    pending = null;
    rollBtn.hidden = true;
    gm("result", "결과", data.narration || ""); // 결과 서술은 굴린 뒤 공개
    finishTurn(data);
  }

  sendBtn.addEventListener("click", () => submit());
  rollBtn.addEventListener("click", doRoll);
  msgEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !busy && !ended && !pending) submit();
  });
  newBtn.addEventListener("click", startSession);

  // 부팅: 세션 시작.
  startSession();
</script>
</body>
</html>
